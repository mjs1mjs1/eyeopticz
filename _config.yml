# Site settings. Change these lines if your details change.
title: EyeOpticz
tagline: Research on the optics of human vision
description: >-
  Original research by Michael J. Simpson, Ph.D., on under-explored parts of
  human vision: the nodal point of the eye, far peripheral vision, negative
  dysphotopsia and the history of physiological optics.
url: "https://eyeopticz.com"
baseurl: ""
lang: en

author:
  name: Michael J. Simpson
  display: Michael J. Simpson, Ph.D.
  short: Simpson, Michael J.
  email: "mjs1@outlook.com"         # the contact email to show on the site (it will be public)
  linkedin: https://www.linkedin.com/in/simpsonmichaelj
  orcid: ""          # paste your ORCID link here when you have one
  scholar: ""        # paste your Google Scholar profile link here when you have one
  photo: ""          # e.g. photo.jpg, after putting the picture in assets/img

# Menu, in order
nav:
  - title: Home
    url: /
  - title: Nodal point
    url: /nodal-point/
  - title: Far peripheral vision
    url: /far-peripheral-vision/
  - title: Negative dysphotopsia
    url: /negative-dysphotopsia/
  - title: History of optics
    url: /history/
  - title: Publications
    url: /publications/
  - title: About
    url: /about/

collections:
  papers:
    output: true
    permalink: /papers/:name/

defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "", type: papers }
    values: { layout: paper, color: teal }
  # Colour and icon for each topic page
  - scope: { path: "nodal-point.md" }
    values: { color: teal, icon: nodal }
  - scope: { path: "far-peripheral-vision.md" }
    values: { color: amber, icon: peripheral }
  - scope: { path: "negative-dysphotopsia.md" }
    values: { color: coral, icon: dysphotopsia }
  - scope: { path: "history.md" }
    values: { color: indigo, icon: history }
  - scope: { path: "publications.md" }
    values: { color: teal, icon: papers }
  - scope: { path: "about.md" }
    values: { color: indigo }

permalink: pretty
exclude: [README.md, SETUP.md, Gemfile, Gemfile.lock, wrangler.jsonc, files/README.txt, assets/img/README.txt]
